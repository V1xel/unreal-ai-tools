[project]
name = "ai-tools-cli"
version = "0.1.0"
description = "CLI (and later MCP server) for driving the AITools Unreal Engine plugin's HTTP surface."
readme = "README.md"
authors = [
    { name = "Vitalii Koliesnik", email = "vitalii.koliesnik@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "psutil>=7.2.2",
    "pyreadline3>=3.5.6 ; sys_platform == 'win32'",
    "questionary>=2.1.1",
]

[project.scripts]
umcp = "cli.main:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "cli"
namespace = true
